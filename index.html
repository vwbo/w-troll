<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>w-troll</title>
    <meta name="theme-color" content="#f3efe8" class="theme-color">
    <meta name="description" content="A short sitting. Hold space.">
    <link rel="icon" href="assets/main.jpg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <template>
      <div class="hello-message">
        <header class="topbar">
          <a class="mark" href="#">w-troll<span>.</span></a>
          <a class="top-link" href="#">w-troll</a>
        </header>

        <main class="stage">
          <div class="copy">
            <p class="kicker">w-troll</p>
            <h1>Look at this face.</h1>
            <p class="lede">Press any key or click:</p>
            <div class="actions">
              <button class="space-key" type="button">Space</button>
              <p class="hint">okay?</p>
            </div>
          </div>
          <figure class="portrait">
            <img src="assets/main.jpg" alt="Orange and white cat looking up">
            <figcaption>click the kitty!!</figcaption>
          </figure>
        </main>

        <footer class="foot">
          <span>Made with 💙🥂</span>
          <a href="#">w-troll</a>
        </footer>
      </div>
      <div class="logout-messages"></div>
    </template>

    <script src="index.js"></script>

  </body>
</html>
